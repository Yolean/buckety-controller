# yaml-language-server: $schema=https://raw.githubusercontent.com/Yolean/buckety-controller/main/schema/buckety-mysql.schema.json
# Collides with the pre-created database that holds a table; the
# default adoption policy (AdoptEmpty) must refuse it.
apiVersion: buckety.yolean.se/v1alpha1
kind: Buckety
metadata:
  name: adopt-pre
spec:
  backend: mysql
  name: "b_${namespace}_${name}"
  retentionPolicy: Delete
  defaultAccess:
    role: ReadWrite
    credentialsSecretName: adopt-pre-db
