apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The one controller deployment the e2e harness applies, for every
# implementation. What differs per implementation is only the
# controller config (configs/<impl>.yaml), which run.sh applies as
# the buckety-controller-config Secret and restarts the controller
# on - the same operation a platform does on a config change.
#
# webhook-certgen is the shipped no-cert-manager path
# (deploy/kustomize/release-tls-selfsigned composes the same two
# directories), so e2e exercises what users deploy instead of a
# harness-local certificate.
namespace: buckety
resources:
- ../../../deploy/kustomize/base
- ../../../deploy/kustomize/webhook-certgen
patches:
- path: deployment.yaml
  target:
    kind: Deployment
    name: buckety-controller
