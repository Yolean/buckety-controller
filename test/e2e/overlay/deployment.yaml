apiVersion: apps/v1
kind: Deployment
metadata:
  name: buckety-controller
spec:
  template:
    spec:
      containers:
      - name: controller
        # Fast drift re-check for e2e: the oob-drift scenarios wait
        # 90-300s for the periodic reconcile to repair out-of-band
        # changes, which the production default of 5m never meets.
        args:
        - "-c"
        - "/etc/buckety"
        - "--periodic-recheck=15s"
        # Credentials for every backing service at once; a config
        # that does not reference a variable leaves it unused. The
        # Secrets live in the controller namespace, created by
        # backing-services/. STORAGE_EMULATOR_HOST routes the GCS
        # client library to the emulator and skips ADC; it only
        # matters when a gcs backend is configured.
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-server
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-server
              key: root-password
        - name: VERSITYGW_ROOT_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: versitygw-server
              key: root-accesskey
        - name: VERSITYGW_ROOT_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: versitygw-server
              key: root-secretkey
        - name: STORAGE_EMULATOR_HOST
          value: fake-gcs.blobs.svc.cluster.local:8000
