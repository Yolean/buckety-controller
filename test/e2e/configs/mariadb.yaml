# yaml-language-server: $schema=https://raw.githubusercontent.com/Yolean/buckety-controller/main/pkg/config/schema/buckety-controller.schema.json
# Controller config for e2e against MariaDB (backing-services/mariadb).
# The account and its password are set up by
# backing-services/mariadb-secret.sh and the first-boot script.
backends:

- name: mysql
  driver: mysql
  config:
    host: mysql.mysql.svc.cluster.local
    adminUser: buckety
    adminPassword: ${MYSQL_BUCKETY_PASSWORD}
    # examples/mysql/oob-drift asserts that a dropped user, extra
    # grants and a rotated password are repaired within a few 15 s
    # re-checks; the default 30m would hide them.
    accountCheckInterval: 0s
  defaults:
    zone: e2e
