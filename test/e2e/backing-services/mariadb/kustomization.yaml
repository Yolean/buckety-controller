# MariaDB for the mysql driver's e2e: one ephemeral node, with the
# controller account created on first boot by the same component
# examples/mysql/bootstrap uses. The account password is the Secret
# mysql-buckety, generated by ../mariadb-secret.sh (no password in
# source), which also copies it to the controller namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mysql
resources:
- mariadb.yaml
components:
- ../../../../examples/mysql/bootstrap/initdb
